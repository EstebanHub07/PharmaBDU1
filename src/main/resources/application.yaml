spring:
  application:
    name: pharmabd
  profiles:
    default: dev
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  cache:
    type: redis
    cache-names: categorias, productos
    redis:
      time-to-live: 10m
      enable-statistics: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4200,http://localhost:8081
